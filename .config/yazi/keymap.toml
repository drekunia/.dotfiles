[[mgr.prepend_keymap]]
on = ["g", "r"]
run = 'shell -- root=$(git rev-parse --show-toplevel 2>/dev/null) && ya emit cd "$root"'
desc = "Go to Git repository root"

[[mgr.prepend_keymap]]
on = ["c", "m"]
run = "plugin chmod"
desc = "Chmod on selected files"

[mgr]
append_keymap = [
  { on = [
    "c",
    "r",
  ], run = "plugin relative-path", desc = "Copy relative path from the started path" },
]
